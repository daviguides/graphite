<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" style="background: #0C0C0E;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#00E5A0" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-m" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#4A464F" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Source code -->
  <rect x="20" y="30" width="140" height="44" rx="6" fill="#161619" stroke="#4A464F" stroke-width="1"/>
  <text x="90" y="57" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#E8E4DF">Source code</text>

  <!-- Arrow: Source -> Tree-sitter -->
  <line x1="160" y1="52" x2="200" y2="52" stroke="#00E5A0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Tree-sitter -->
  <rect x="210" y="30" width="140" height="44" rx="6" fill="#161619" stroke="#00E5A0" stroke-width="1"/>
  <text x="280" y="57" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#00E5A0">Tree-sitter</text>

  <!-- Arrow: Tree-sitter -> CozoDB -->
  <line x1="350" y1="52" x2="400" y2="52" stroke="#00E5A0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CozoDB -->
  <rect x="410" y="20" width="330" height="64" rx="6" fill="#161619" stroke="#00E5A0" stroke-width="1"/>
  <text x="575" y="47" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#00E5A0">CozoDB</text>
  <text x="575" y="67" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#8A8690">facts + Datalog rules, RocksDB</text>

  <!-- Arrow: CozoDB -> Adjacency -->
  <line x1="575" y1="84" x2="575" y2="130" stroke="#00E5A0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="590" y="115" font-family="Inter, sans-serif" font-size="10" fill="#8A8690">derived</text>

  <!-- In-memory adjacency -->
  <rect x="410" y="140" width="330" height="44" rx="6" fill="#161619" stroke="#4A464F" stroke-width="1"/>
  <text x="575" y="167" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#E8E4DF">In-memory adjacency</text>

  <!-- Arrow: Adjacency -> Daemon -->
  <line x1="575" y1="184" x2="575" y2="230" stroke="#4A464F" stroke-width="1.5" marker-end="url(#arrow-m)"/>

  <!-- Daemon box -->
  <rect x="310" y="240" width="440" height="54" rx="8" fill="#1E1E22" stroke="#00E5A0" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="380" y="271" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#00E5A0">ONE DAEMON PER REPO</text>
  <text x="620" y="271" font-family="Inter, sans-serif" font-size="11" fill="#8A8690">unix socket</text>

  <!-- Lines down to clients -->
  <line x1="400" y1="294" x2="400" y2="340" stroke="#4A464F" stroke-width="1" marker-end="url(#arrow-m)"/>
  <line x1="500" y1="294" x2="500" y2="340" stroke="#4A464F" stroke-width="1" marker-end="url(#arrow-m)"/>
  <line x1="600" y1="294" x2="600" y2="340" stroke="#4A464F" stroke-width="1" marker-end="url(#arrow-m)"/>
  <line x1="700" y1="294" x2="700" y2="340" stroke="#4A464F" stroke-width="1" marker-end="url(#arrow-m)"/>

  <!-- Client boxes -->
  <rect x="355" y="350" width="90" height="50" rx="6" fill="#161619" stroke="#4A464F" stroke-width="1"/>
  <text x="400" y="372" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#E8E4DF">CLI</text>
  <text x="400" y="389" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#8A8690">Bash</text>

  <rect x="455" y="350" width="90" height="50" rx="6" fill="#161619" stroke="#4A464F" stroke-width="1"/>
  <text x="500" y="372" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#E8E4DF">MCP shim</text>
  <text x="500" y="389" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#8A8690">stdio</text>

  <rect x="555" y="350" width="90" height="50" rx="6" fill="#161619" stroke="#4A464F" stroke-width="1"/>
  <text x="600" y="372" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#E8E4DF">Hooks</text>
  <text x="600" y="389" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#8A8690">grep / edit</text>

  <rect x="655" y="350" width="90" height="50" rx="6" fill="#161619" stroke="#4A464F" stroke-width="1"/>
  <text x="700" y="372" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#E8E4DF">Runner</text>
  <text x="700" y="389" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#8A8690">bridge</text>

  <!-- Caption -->
  <text x="530" y="415" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#8A8690">thin clients; N agent sessions share one hot graph</text>
</svg>
