<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" style="background: #0C0C0E;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#00E5A0" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-m" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#4A464F" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Row 1: Source code → Tree-sitter (centered) -->
  <rect x="140" y="24" width="140" height="42" rx="6" fill="#161619" stroke="#4A464F" stroke-width="1"/>
  <text x="210" y="50" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#E8E4DF">Source code</text>

  <line x1="280" y1="45" x2="330" y2="45" stroke="#00E5A0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="340" y="24" width="140" height="42" rx="6" fill="#161619" stroke="#00E5A0" stroke-width="1"/>
  <text x="410" y="50" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#00E5A0">Tree-sitter</text>

  <!-- Arrow down to CozoDB -->
  <line x1="410" y1="66" x2="410" y2="100" stroke="#00E5A0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2: CozoDB (centered, wider) -->
  <rect x="210" y="110" width="400" height="56" rx="6" fill="#161619" stroke="#00E5A0" stroke-width="1"/>
  <text x="410" y="134" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#00E5A0">CozoDB</text>
  <text x="410" y="153" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#8A8690">facts + Datalog rules, RocksDB</text>

  <!-- Arrow down to adjacency -->
  <line x1="410" y1="166" x2="410" y2="200" stroke="#00E5A0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="435" y="190" font-family="Inter, sans-serif" font-size="10" fill="#8A8690">derived</text>

  <!-- Row 3: In-memory adjacency (centered, same width as CozoDB) -->
  <rect x="210" y="210" width="400" height="42" rx="6" fill="#161619" stroke="#4A464F" stroke-width="1"/>
  <text x="410" y="236" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#E8E4DF">In-memory adjacency</text>

  <!-- Arrow down to daemon -->
  <line x1="410" y1="252" x2="410" y2="286" stroke="#4A464F" stroke-width="1.5" marker-end="url(#arrow-m)"/>

  <!-- Row 4: Daemon box (centered, wide) -->
  <rect x="160" y="296" width="500" height="48" rx="8" fill="#1E1E22" stroke="#00E5A0" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="340" y="325" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#00E5A0">ONE DAEMON PER REPO</text>
  <text x="560" y="325" font-family="Inter, sans-serif" font-size="11" fill="#8A8690">unix socket</text>

  <!-- Lines down to clients -->
  <line x1="260" y1="344" x2="260" y2="376" stroke="#4A464F" stroke-width="1" marker-end="url(#arrow-m)"/>
  <line x1="360" y1="344" x2="360" y2="376" stroke="#4A464F" stroke-width="1" marker-end="url(#arrow-m)"/>
  <line x1="460" y1="344" x2="460" y2="376" stroke="#4A464F" stroke-width="1" marker-end="url(#arrow-m)"/>
  <line x1="560" y1="344" x2="560" y2="376" stroke="#4A464F" stroke-width="1" marker-end="url(#arrow-m)"/>

  <!-- Row 5: Client boxes (evenly spaced, centered) -->
  <rect x="215" y="386" width="90" height="44" rx="6" fill="#161619" stroke="#4A464F" stroke-width="1"/>
  <text x="260" y="405" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#E8E4DF">CLI</text>
  <text x="260" y="421" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#8A8690">Bash</text>

  <rect x="315" y="386" width="90" height="44" rx="6" fill="#161619" stroke="#4A464F" stroke-width="1"/>
  <text x="360" y="405" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#E8E4DF">MCP shim</text>
  <text x="360" y="421" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#8A8690">stdio</text>

  <rect x="415" y="386" width="90" height="44" rx="6" fill="#161619" stroke="#4A464F" stroke-width="1"/>
  <text x="460" y="405" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#E8E4DF">Hooks</text>
  <text x="460" y="421" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#8A8690">grep / edit</text>

  <rect x="515" y="386" width="90" height="44" rx="6" fill="#161619" stroke="#4A464F" stroke-width="1"/>
  <text x="560" y="405" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#E8E4DF">Runner</text>
  <text x="560" y="421" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#8A8690">bridge</text>
</svg>
