[workspace]
resolver = "2"
members = ["common", "cozo-bench"]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
common = { path = "common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
debug = false
codegen-units = 16
