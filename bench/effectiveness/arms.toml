# Bench arms. Both arms use the same model, flags, prompt and sandbox;
# arm B only adds the Graphite setup commands and one prompt line.
#
# Placeholders in `setup` / `teardown`: {tree} = task worktree path,
# {graphite} = the graphite binary (GRAPHITE_BIN or `graphite` on PATH).
# `requires` = executables that must resolve for the arm to run.

[arms.A]
name = "baseline"
setup = []
teardown = []
prompt_suffix = ""
requires = []

[arms.B]
name = "graphite"
# `init` starts the per-repo daemon if needed and blocks until the first
# index is built. Setup time is not counted in the agent's wall-clock.
setup = ["{graphite} init --repo {tree} --json"]
teardown = ["{graphite} daemon stop --repo {tree} --json"]
prompt_suffix = """
A code-graph CLI for this repository is on PATH: `graphite`. Use it instead of
grep/find/reading many files to locate symbols, their callers and the impact
of a change (source is included in the answers):
  graphite lookup <symbol> --json            where a symbol is defined
  graphite blast <symbol> [--depth N] --json  everything that depends on it
  graphite diff-impact --json                 what your uncommitted changes affect
"""
requires = ["graphite"]

[arms.B2]
name = "graphite-text"
# Same as B, but the agent is pointed at the compact text format (default
# output since 3d4fdc1..478fbda): verdict line COMPLETE / LOWER-BOUND,
# call-site lines, no JSON.
setup = ["{graphite} init --repo {tree}"]
teardown = ["{graphite} daemon stop --repo {tree}"]
prompt_suffix = """
A code-graph CLI for this repository is on PATH: `graphite`. Use it instead of
grep/find/reading many files to locate symbols, their callers and the impact
of a change. Answers are complete unless they say LOWER-BOUND, and include
call-site lines:
  graphite lookup <symbol>             where a symbol is defined
  graphite blast <symbol> [--depth N]  everything that depends on it
  graphite diff-impact                 what your uncommitted changes affect
"""
requires = ["graphite"]

[arms.C]
name = "graphite-text+hooks"
# B2 plus interception hooks: PreToolUse on Bash / Grep / Read answers with
# the graph (project .claude/settings.json). Needs `graphite hooks` (feat/hooks).
setup = ["{graphite} init --repo {tree}", "{graphite} hooks install --repo {tree}"]
teardown = ["{graphite} hooks uninstall --repo {tree}", "{graphite} daemon stop --repo {tree}"]
prompt_suffix = """
A code-graph CLI for this repository is on PATH: `graphite`. Use it instead of
grep/find/reading many files to locate symbols, their callers and the impact
of a change. Answers are complete unless they say LOWER-BOUND, and include
call-site lines:
  graphite lookup <symbol>             where a symbol is defined
  graphite blast <symbol> [--depth N]  everything that depends on it
  graphite diff-impact                 what your uncommitted changes affect
"""
requires = ["graphite"]
collect = [".graphite/hooks.jsonl"]
requires_subcommand = "hooks"
