code, and when a spawn step cannot tell, run the action anyway and say
why.

The lens review has the same problem with briefs: a brief file that exists
but is empty or unreadable is shown to the lens as "(missing on disk)"; an
unreadable briefs manifest comes back as an empty plan, which the review
reads as "no findings"; an unreadable decisions.yaml reads as "(none)".
