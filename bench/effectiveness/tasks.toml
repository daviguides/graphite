[[task]]
id = "regent-is-ancestor-tristate"
kind = "bugfix"
difficulty = "medium"
ref = "b3fc411912"
suites = ["tools/orch/regent"]
prompt = """
regent's delivery scoreboard reported four tasks as "delivered nothing"
although they are merged and on main. When git cannot answer whether a
commit is an ancestor (exit 128: object not available locally) the answer
is read as "not an ancestor", and the pinned tip is never fetched on its
own, so ancestry is asked about objects git does not have.

Expected: fetch the tip once before scoring any task; an ancestry check
answers yes / no / could-not-tell, and could-not-tell is reported as
"could not read", never as "delivered nothing"; a git timeout must not
read as "no". Measure what a merge delivered against the merge's own first
parent rather than the tip, and never use `git show` on a merge commit. A
diff that could not be read is a skip, not a verdict.
"""
statement_hinted = """
Bug in regent's delivery scoreboard (regent/core/delivery.py): four merged,
on-main tasks were reported as "delivered nothing". `_is_ancestor` returns
`returncode == 0`, so git exit 128 (object not available locally) reads the
same as exit 1 ("not an ancestor"). The pinned tip is also never fetched on
its own, so ancestry is asked about objects git does not have.

Fix it: fetch the tip once before scoring any task; make `_is_ancestor`
return True / False / None (None when git errors) and route None to
"could not read" instead of "delivered nothing"; a git timeout must not be
reported as exit 1. Measure what a merge delivered against the merge's own
first parent rather than the tip, and never use `git show` on a merge
commit. A diff that could not be read must be a skip, not a verdict.
"""

[[task]]
