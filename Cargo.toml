[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["bench", "references"]

[workspace.package]
edition = "2021"
publish = false
version = "0.1.0"

[workspace.dependencies]
graphite-model = { path = "crates/model" }
graphite-store = { path = "crates/store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
thiserror = "2"
# mnestic: maintained CozoDB fork; the importable crate name stays `cozo`. Pinned exact (see references/studies/cozodb-health.md).
cozo = { package = "mnestic", version = "=0.18.0", default-features = false, features = ["storage-new-rocksdb"] }
